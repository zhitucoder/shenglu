<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>声录 · 音频智能助手</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 48 48" width="42" height="42">
        <circle cx="24" cy="24" r="22" fill="none" stroke="#e0a458" stroke-width="1.6"/>
        <circle cx="24" cy="24" r="5" fill="#e0a458" opacity=".9"/>
        <g stroke="#e0a458" stroke-width="1.6" stroke-linecap="round">
          <line x1="24" y1="12" x2="24" y2="6"/>
          <line x1="24" y1="36" x2="24" y2="42"/>
          <line x1="12" y1="24" x2="6" y2="24"/>
          <line x1="36" y1="24" x2="42" y2="24"/>
          <line x1="15.5" y1="15.5" x2="11.3" y2="11.3"/>
          <line x1="32.5" y1="32.5" x2="36.7" y2="36.7"/>
          <line x1="32.5" y1="15.5" x2="36.7" y2="11.3"/>
          <line x1="15.5" y1="32.5" x2="11.3" y2="36.7"/>
        </g>
      </svg>
    </div>
    <div class="brand-text">
      <h1>声录</h1>
      <span class="brand-sub">AUDIO INTELLIGENCE · 转写 / 总结 / 问答</span>
    </div>
  </div>
  <div class="top-status">
    <span class="pulse-dot"></span>
    <span>服务在线</span>
  </div>
</header>

<main class="shell">
  <!-- 侧栏 · 历史 -->
  <aside class="sidebar">
    <section class="panel history-panel">
      <div class="panel-head">
        <h2 class="kicker">历史记录</h2>
        <button class="icon-btn" id="refreshBtn" title="刷新">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
        </button>
      </div>
      <ul class="history" id="historyList">
        <li class="history-empty">暂无记录, 先上传一个音频吧。</li>
      </ul>
    </section>
  </aside>

  <!-- 主工作区 -->
  <section class="workspace">
    <section class="panel upload-panel" id="uploadPanel">
      <div class="dropzone" id="dropzone">
        <div class="dz-graphic">
          <div class="reel" id="reel"><span class="reel-dot"></span></div>
        </div>
        <div class="dz-copy">
          <p class="dz-title">把音频拖进来</p>
          <p class="dz-hint">点击或拖拽选择文件 · mp3 / wav / m4a / flac / ogg / aac</p>
        </div>
        <input type="file" id="fileInput" accept="audio/*,.mp3,.wav,.m4a,.flac,.ogg,.aac" hidden>
      </div>
      <div class="progress hidden" id="progressWrap">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <span class="progress-pct" id="progressText">0%</span>
      </div>
      <p class="error hidden" id="uploadError"></p>
      <div class="current hidden" id="currentInfo">
        <span class="live-dot"></span>
        <span class="label">当前会话</span>
        <code id="currentId"></code>
        <span class="sep">·</span>
        <span id="currentStatus"></span>
      </div>
    </section>

    <div class="split">
      <!-- 原文 / 报告 -->
      <section class="panel content-panel hidden" id="contentPanel">
        <div class="tabs">
          <div class="seg" role="tablist">
            <button class="tab active" data-tab="transcript" role="tab">转写原文</button>
            <button class="tab" data-tab="report" role="tab">总结报告</button>
          </div>
          <span class="spacer"></span>
          <a class="btn ghost hidden" id="dlTranscript" href="javascript:void(0)">下载原文</a>
          <a class="btn ghost hidden" id="dlReport" href="javascript:void(0)">下载报告</a>
          <button class="btn primary" id="genReportBtn">生成总结报告</button>
        </div>
        <pre class="content" id="transcriptView"></pre>
        <pre class="content hidden" id="reportView"></pre>
      </section>

      <!-- 问答 -->
      <section class="panel chat-panel hidden" id="chatPanel">
        <div class="panel-head">
          <h2 class="kicker">基于原文提问</h2>
          <span class="chip">DeepSeek</span>
        </div>
        <div class="chat-box" id="chatBox">
          <p class="chat-placeholder">音频转写完成后, 在这里提问。</p>
        </div>
        <form class="chat-input" id="chatForm">
          <input type="text" id="chatInput" placeholder="例如: 这段音频讲了什么?" autocomplete="off">
          <button type="submit" class="btn primary send">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4z"/></svg>
            <span>发送</span>
          </button>
        </form>
      </section>
    </div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
